name: Génération et publication
on:
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions
  schedule:
    - cron: "0 9 * * *"     # et chaque jour (heure UTC)
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get install -y espeak-ng
      - run: pip install openpyxl pypinyin pykakasi korean-romanizer pycantonese edge-tts
      - run: python build_data.py "${{ vars.SHEET_ID }}" --out site
      - name: Sauvegarder données et audio dans le dépôt
        run: |
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git add site a_verifier.csv 2>/dev/null || git add site
          if ! git diff --cached --quiet; then git commit -m "Mise à jour des données" && git push; fi
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
