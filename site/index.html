<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guide de conversation</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f4e79">
<style>
:root{--bg:#faf9f6;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--bd:#e2e0d8;--ac:#1f4e79;--acbg:#e6eef6;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#212120;--tx:#eeeeea;--mut:#a3a39c;--bd:#38382f;--ac:#8fb8e0;--acbg:#243241;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--card:#212120;--tx:#eeeeea;--mut:#a3a39c;--bd:#38382f;--ac:#8fb8e0;--acbg:#243241;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:0 0 12px}
input[type=search]{width:100%;padding:12px 14px;font-size:1rem;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip,.tog{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 12px;font-size:.9rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.top{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.top h1{flex:1;margin:0}
select,.gear{padding:8px 10px;font-size:1rem;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
.gear{cursor:pointer}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);padding:18px;max-width:320px;width:90%}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{font-size:1.05rem;margin:0 0 6px}
dialog label{display:block;padding:8px 0}
dialog button{margin-top:10px;width:100%;padding:10px;border:0;border-radius:10px;background:var(--ac);color:var(--bg);font-size:1rem;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0;display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.loc{font-size:1.6rem;line-height:1.25;word-break:break-word}
.play{grid-row:1/3;grid-column:2;align-self:start;width:48px;height:48px;border-radius:50%;border:0;background:var(--ac);color:var(--bg);font-size:1.2rem;cursor:pointer}
.tr{grid-column:1}
.tr b{font-weight:600}
.det{grid-column:1/-1;border-top:1px dashed var(--bd);padding-top:8px;margin-top:4px;font-size:.92rem;color:var(--mut);display:grid;gap:2px}
.det span{color:var(--tx)}
.tag{font-size:.75rem;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:30px 0}
</style>
</head>
<body>
<main>
<div class="top">
<h1>Guide de conversation</h1>
<select id="lang" aria-label="Langue"></select>
<button class="gear" id="opt" aria-label="Options d’affichage">⚙</button>
</div>
<input type="search" id="q" placeholder="Chercher : « merci », « ni hao », « baño »…" autocomplete="off">
<div class="row" id="cats"></div>
<dialog id="dlg"><h2>Informations affichées</h2><div id="opts"></div><button id="close">Fermer</button></dialog>
<div id="list"></div>
</main>
<script>
fetch("data.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(DATA=>{

const norm=s=>(s||"").normalize("NFD").replace(/\p{M}/gu,"").toLowerCase();
const $=id=>document.getElementById(id);
const L=Object.fromEntries(DATA.langues.map(l=>[l.code,l]));
const state={lang:DATA.langues[0].code,cat:"",q:"",show:{fr:true,en:true,api:true,roman:true,commentaire:true}};
const LABELS={fr:"FR",en:"EN",api:"API",roman:"Romanisation",commentaire:"Commentaires"};

function initLang(){
  const s=$("lang");
  DATA.langues.forEach(l=>{const o=document.createElement("option");o.value=l.code;o.textContent=l.nom;s.appendChild(o)});
  s.value=state.lang;
  s.onchange=()=>{state.lang=s.value;state.cat="";cats();render()};
}
function cats(){
  const c=[...new Set(DATA.expressions.filter(e=>e.langue===state.lang).map(e=>e.categorie))];
  $("cats").innerHTML="";
  [["","Toutes"],...c.map(x=>[x,x])].forEach(([v,n])=>{const b=document.createElement("button");b.className="chip";b.textContent=n;
    b.setAttribute("aria-pressed",state.cat===v);b.onclick=()=>{state.cat=v;cats();render()};$("cats").appendChild(b)});
}
function dlg(){
  Object.keys(LABELS).forEach(k=>{const l=document.createElement("label"),i=document.createElement("input");
    i.type="checkbox";i.checked=state.show[k];i.onchange=()=>{state.show[k]=i.checked;render()};
    l.append(i," "+LABELS[k]);$("opts").appendChild(l)});
  $("opt").onclick=()=>$("dlg").showModal();
  $("close").onclick=()=>$("dlg").close();
}
function speak(e){
  const tts=()=>{if(!("speechSynthesis" in window)||!L[e.langue].voix_nav)return;speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(e.texte);u.lang=L[e.langue].voix_nav;u.rate=.85;speechSynthesis.speak(u)};
  if(!e.audio)return tts();
  const a=new Audio(e.audio);let done=false;
  const fb=()=>{if(!done){done=true;tts()}};
  a.onerror=fb;a.play().catch(fb);
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
  const q=norm(state.q).trim();
  const rows=DATA.expressions.filter(e=>e.langue===state.lang&&(!state.cat||e.categorie===state.cat)&&
    (!q||norm([e.texte,e.fr,e.en,e.api,e.roman,e.commentaire,e.categorie].join(" ")).includes(q)));
  const box=$("list");box.innerHTML="";
  if(!rows.length){box.innerHTML='<div class="empty">Aucune expression trouvée.</div>';return}
  rows.forEach(e=>{
    const s=state.show,l=L[e.langue],d=document.createElement("div");d.className="card";
    const det=[];
    if(s.api&&e.api)det.push(`API : <span>/${esc(e.api)}/</span>`);
    if(s.roman&&e.roman)det.push(`${esc(l.systeme||"Romanisation")} : <span>${esc(e.roman)}</span>`);
    if(s.commentaire&&e.commentaire)det.push(`<span>${esc(e.commentaire)}</span>`);
    d.innerHTML=`<div class="loc" lang="${l.voix_nav}">${esc(e.texte)}</div>
      <button class="play" aria-label="Écouter la prononciation">▶</button>
      <div class="tr">${s.fr?`<b>${esc(e.fr)}</b>`:""}${s.fr&&s.en?" · ":""}${s.en?esc(e.en):""}
      <div class="tag">${esc(e.categorie)}${e.auto&&e.auto.length?" · phonétique à vérifier":""}</div></div>
      ${det.length?`<div class="det">${det.map(x=>`<div>${x}</div>`).join("")}</div>`:""}`;
    d.querySelector(".play").onclick=()=>speak(e);
    box.appendChild(d);
  });
}
$("q").oninput=ev=>{state.q=ev.target.value;render()};
initLang();cats();dlg();render();
}).catch(()=>{document.getElementById("list").innerHTML='<div class="empty">Données introuvables (data.json).</div>'});
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"});
  navigator.serviceWorker.ready.then(r=>r.active&&r.active.postMessage("precache"));
}
</script>
</body>
</html>
